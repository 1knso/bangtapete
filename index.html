<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BANG! - Rastreador Central</title>
    <style>
        :root {
            --bg-color: #1f140e;
            --text-color: #d7ccc8;
            --accent-color: #bcaaa4;
            --arrow-color: #8d6e63;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #2e1d15 0%, #110a07 100%);
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* Contenedor central para las vidas */
        .health-tracker {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .bullets-container {
            display: flex;
            gap: 15px;
        }

        /* Estilos de las balas (SVGs) */
        .bullet {
            width: 45px;
            height: 110px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, filter 0.4s ease;
            filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.6));
        }

        .bullet.spent {
            transform: rotate(180deg) translateY(-15px);
            opacity: 0.25;
            filter: drop-shadow(0px -2px 4px rgba(0,0,0,0.8)) grayscale(0.9);
        }

        /* Indicadores de dirección (Flechas y texto) */
        .guide {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.7;
        }

        .guide svg {
            width: 24px;
            height: 24px;
            fill: var(--arrow-color);
        }

        /* Posicionamiento en los bordes de la pantalla */
        .guide-character {
            left: 30px;
            /* Flex direccional para que la flecha apunte hacia la izquierda y quede fuera */
            flex-direction: row-reverse; 
        }

        .guide-weapon {
            right: 30px;
        }

        .guide-equipment {
            bottom: 30px;
            flex-direction: column;
            gap: 5px;
        }

        /* Ajuste para pantallas verticales */
        @media (max-aspect-ratio: 1/1) {
            .guide-character { top: 30px; left: 50%; transform: translateX(-50%); flex-direction: column-reverse; }
            .guide-character svg { transform: rotate(90deg); } /* Apunta arriba */
            
            .guide-weapon { bottom: 30px; top: auto; left: 50%; right: auto; transform: translateX(-50%); flex-direction: column; }
            .guide-weapon svg { transform: rotate(90deg); } /* Apunta abajo */
            
            .guide-equipment { display: none; } /* En vertical se puede simplificar el espacio */
            
            .bullet { width: 35px; height: 85px; }
        }
    </style>
</head>
<body>

    <!-- Guías visuales apuntando hacia fuera del móvil -->
    <div class="guide guide-character">
        <span>Personaje</span>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
    </div>

    <div class="guide guide-weapon">
        <span>Arma</span>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 11h12.17l-5.59-5.59L12 4l8 8-8 8-1.41-1.41L16.17 13H4v-2z"/>
        </svg>
    </div>

    <div class="guide guide-equipment">
        <span>Equipables</span>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/>
        </svg>
    </div>

    <!-- Rastreador central -->
    <div class="health-tracker">
        <div class="bullets-container" id="bullets-container">
            <!-- Balas inyectadas por JS -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const MAX_LIVES = 5;
            const container = document.getElementById('bullets-container');

            const bulletSVG = `
                <svg viewBox="0 0 40 100" xmlns="http://www.w3.org/2000/svg" class="bullet">
                    <defs>
                        <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#9c7722"/>
                            <stop offset="30%" stop-color="#e8c25f"/>
                            <stop offset="50%" stop-color="#fced9d"/>
                            <stop offset="70%" stop-color="#d4a331"/>
                            <stop offset="100%" stop-color="#7a5b13"/>
                        </linearGradient>
                        <linearGradient id="tipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#595959"/>
                            <stop offset="40%" stop-color="#a6a6a6"/>
                            <stop offset="100%" stop-color="#404040"/>
                        </linearGradient>
                    </defs>
                    <path d="M 10 30 C 10 5, 17 0, 20 0 C 23 0, 30 5, 30 30 Z" fill="url(#tipGrad)" />
                    <rect x="10" y="30" width="20" height="62" fill="url(#casingGrad)" />
                    <rect x="8" y="92" width="24" height="6" rx="2" fill="url(#casingGrad)" />
                    <rect x="10" y="89" width="20" height="3" fill="#362809" />
                </svg>
            `;

            // Construcción del DOM optimizada
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < MAX_LIVES; i++) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = bulletSVG.trim();
                const bulletNode = tempDiv.firstChild;
                
                bulletNode.addEventListener('click', function() {
                    this.classList.toggle('spent');
                });

                fragment.appendChild(bulletNode);
            }

            container.appendChild(fragment);
        });
    </script>
</body>
</html>
