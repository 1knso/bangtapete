<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Optimizaciones de viewport para evitar zoom y ajustar escalas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BANG! - Vidas</title>

    <!-- PWA / WebApp Meta Tags para iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bang Vidas">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1f140e">

    <!-- Manifiesto integrado para Android -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Bang Vidas","short_name":"Bang","display":"fullscreen","background_color":"#1f140e","theme_color":"#1f140e"}'>

    <style>
        :root {
            --bg-color: #1f140e;
            --text-color: #d7ccc8;
            --accent-color: #bcaaa4;
            --arrow-color: #8d6e63;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Evitar selecciones accidentales y menú contextual en móviles */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #2e1d15 0%, #110a07 100%);
            overflow: hidden;
            /* Evitar efecto rebote al deslizar */
            overscroll-behavior-y: none;
            touch-action: none;
        }

        /* Botón de pantalla completa sutil */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            z-index: 100;
            transition: background 0.3s;
        }

        .fullscreen-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Contenedor central para las vidas */
        .health-tracker {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .bullets-container {
            display: flex;
            gap: 15px;
        }

        .bullet {
            width: 45px;
            height: 110px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, filter 0.4s ease;
            filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.6));
        }

        .bullet.spent {
            transform: rotate(180deg) translateY(-15px);
            opacity: 0.25;
            filter: drop-shadow(0px -2px 4px rgba(0,0,0,0.8)) grayscale(0.9);
        }

        /* Indicadores de dirección (Flechas y texto) */
        .guide {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.7;
        }

        .guide svg {
            width: 24px;
            height: 24px;
            fill: var(--arrow-color);
        }

        .guide-character {
            left: 30px;
            flex-direction: row-reverse; 
        }

        .guide-weapon {
            right: 30px;
        }

        .guide-equipment {
            bottom: 30px;
            flex-direction: column;
            gap: 5px;
        }

        /* Ajuste para pantallas verticales */
        @media (max-aspect-ratio: 1/1) {
            .guide-character { top: 40px; left: 50%; transform: translateX(-50%); flex-direction: column-reverse; }
            .guide-character svg { transform: rotate(90deg); }
            
            .guide-weapon { bottom: 40px; top: auto; left: 50%; right: auto; transform: translateX(-50%); flex-direction: column; }
            .guide-weapon svg { transform: rotate(90deg); }
            
            .guide-equipment { display: none; }
            
            .bullet { width: 35px; height: 85px; }
            .fullscreen-btn { top: 10px; right: 10px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <!-- Botón para forzar Fullscreen (útil si se abre desde el navegador) -->
    <button class="fullscreen-btn" id="fs-btn">Pantalla Completa</button>

    <div class="guide guide-character">
        <span>Personaje</span>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
    </div>

    <div class="guide guide-weapon">
        <span>Arma</span>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 11h12.17l-5.59-5.59L12 4l8 8-8 8-1.41-1.41L16.17 13H4v-2z"/>
        </svg>
    </div>

    <div class="guide guide-equipment">
        <span>Equipables</span>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/>
        </svg>
    </div>

    <div class="health-tracker">
        <div class="bullets-container" id="bullets-container">
            <!-- Inyectado por JS -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // -- Lógica de las Balas --
            const MAX_LIVES = 5;
            const container = document.getElementById('bullets-container');
            const fragment = document.createDocumentFragment();

            const bulletSVG = `
                <svg viewBox="0 0 40 100" xmlns="http://www.w3.org/2000/svg" class="bullet">
                    <defs>
                        <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#9c7722"/>
                            <stop offset="30%" stop-color="#e8c25f"/>
                            <stop offset="50%" stop-color="#fced9d"/>
                            <stop offset="70%" stop-color="#d4a331"/>
                            <stop offset="100%" stop-color="#7a5b13"/>
                        </linearGradient>
                        <linearGradient id="tipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#595959"/>
                            <stop offset="40%" stop-color="#a6a6a6"/>
                            <stop offset="100%" stop-color="#404040"/>
                        </linearGradient>
                    </defs>
                    <path d="M 10 30 C 10 5, 17 0, 20 0 C 23 0, 30 5, 30 30 Z" fill="url(#tipGrad)" />
                    <rect x="10" y="30" width="20" height="62" fill="url(#casingGrad)" />
                    <rect x="8" y="92" width="24" height="6" rx="2" fill="url(#casingGrad)" />
                    <rect x="10" y="89" width="20" height="3" fill="#362809" />
                </svg>
            `;

            for (let i = 0; i < MAX_LIVES; i++) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = bulletSVG.trim();
                const bulletNode = tempDiv.firstChild;
                
                bulletNode.addEventListener('click', function() {
                    this.classList.toggle('spent');
                });

                fragment.appendChild(bulletNode);
            }
            container.appendChild(fragment);

            // -- Lógica de Pantalla Completa --
            const fsBtn = document.getElementById('fs-btn');
            
            // Ocultar botón si ya estamos en modo "standalone" (app instalada)
            if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
                fsBtn.style.display = 'none';
            }

            fsBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn(`No se pudo activar pantalla completa: ${err.message}`);
                    });
                    fsBtn.textContent = 'Salir';
                } else {
                    document.exitFullscreen();
                    fsBtn.textContent = 'Pantalla Completa';
                }
            });

            // Prevenir comportamiento por defecto de gestos multitáctiles y scroll
            document.addEventListener('touchmove', function (event) {
                if (event.scale !== 1) {
                    event.preventDefault();
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
